<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200, initial-scale=1.0"/>
<title>Banner OG: Diego Santos | Oráculo</title>
<meta name="description" content="Banner OG da página de análise de presença digital de Diego Santos. Uso interno Oráculo Tecnologia."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#12245e}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}

  .og{position:relative;width:1200px;height:630px;background:#12245e;overflow:hidden;display:flex;align-items:center}

  /* malha técnica de fundo */
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:74px 74px;background-position:-1px -1px}
  .arc{position:absolute;border:1px solid rgba(255,255,255,.10);border-radius:50%}
  .arc.a{width:620px;height:620px;top:-186px;right:80px}
  .arc.b{width:940px;height:940px;top:-330px;right:-160px;border-color:rgba(255,255,255,.06)}

  /* barras de dados */
  .bars{position:absolute;bottom:0;left:430px;right:0;height:520px;display:flex;align-items:flex-end;gap:26px;padding-right:60px}
  .bars i{display:block;flex:1;background:rgba(255,255,255,.045);border-top:1px solid rgba(255,255,255,.10)}

  .inner{position:relative;width:100%;height:100%;padding:56px 60px;display:flex;flex-direction:column;justify-content:center}

  .mark{font-size:15px;font-weight:800;letter-spacing:.24em;color:#c3d0f2;text-transform:uppercase}
  .rule{margin:22px 0 34px;width:470px;height:1px;background:rgba(255,255,255,.26);position:relative}
  .rule::before{content:'';position:absolute;left:0;top:-1.5px;width:76px;height:4px;background:#2f6bff;border-radius:2px}

  h1{font-size:66px;line-height:.98;font-weight:900;letter-spacing:-.028em;color:#fff;text-transform:uppercase;max-width:640px}

  .name-rule{margin:32px 0 22px;width:470px;height:1px;background:rgba(255,255,255,.20)}
  .name{font-size:46px;font-weight:800;letter-spacing:-.02em;color:#8fb0ff;line-height:1}
  .role{margin-top:12px;font-size:17px;font-weight:700;letter-spacing:.16em;color:#e8eeff;text-transform:uppercase}
  .claim{margin-top:26px;font-size:20px;font-weight:500;color:#c3d0f2;max-width:520px;line-height:1.4}
  .tag{margin-top:30px;display:inline-block;align-self:flex-start;border:1px solid rgba(255,255,255,.32);
       padding:13px 22px;font-size:13px;font-weight:700;letter-spacing:.19em;color:#e8eeff;text-transform:uppercase}

  /* painel de números */
  .panel{position:absolute;right:0;top:196px;width:452px;background:#f7f6f1;padding:8px 0}
  .panel .row{display:flex;align-items:center;gap:22px;padding:22px 34px}
  .panel .row + .row{border-top:1px solid #d9d7cf}
  .panel .fig{font-size:37px;font-weight:900;letter-spacing:-.03em;color:#12245e;line-height:1;white-space:nowrap;min-width:148px}
  .panel .fig small{font-size:20px;font-weight:800;margin-left:5px}
  .panel .lab{font-size:13px;font-weight:700;letter-spacing:.08em;color:#3a4a7a;text-transform:uppercase;line-height:1.35;white-space:nowrap;border-left:1px solid #d9d7cf;padding-left:22px}
</style>
</head>
<body>
<div class="og" id="og-presenca">
  <div class="grid"></div>
  <div class="arc a"></div>
  <div class="arc b"></div>
  <div class="bars"><i style="height:34%"></i><i style="height:58%"></i><i style="height:22%"></i><i style="height:71%"></i><i style="height:44%"></i><i style="height:88%"></i><i style="height:52%"></i></div>

  <div class="inner">
    <div class="mark">Oráculo Tecnologia</div>
    <div class="rule"></div>
    <h1>Análise de<br/>presença digital</h1>
    <div class="name-rule"></div>
    <div class="name">Diego Santos</div>
    <div class="role">Advogado · Palhoça/SC</div>
    <p class="claim">A audiência já existe. O caminho até o advogado, não.</p>
    <span class="tag">Plano estratégico · 180 dias</span>
  </div>

  <div class="panel">
    <div class="row"><span class="fig">2.886</span><span class="lab">Seguidores</span></div>
    <div class="row"><span class="fig">3,89<small>%</small></span><span class="lab">Engajamento 2026</span></div>
    <div class="row"><span class="fig">180 <small>DIAS</small></span><span class="lab">Plano de implantação</span></div>
  </div>
</div>
</body>
</html>
